<html>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
        body { font-family: 'Noto Sans', sans-serif; }
        button, input { font: inherit; }
        #container {
            padding: 8px;
            width: 400px;
        }
        p { margin: 4px 0; }
        .bold { font-weight: 700; }
        .italic { font-style: italic; }
        .bold-italic { font-weight: 700; font-style: italic; }
        .underline { text-decoration: underline; }
        .strike { text-decoration: line-through; }
        .justify { text-align: justify; }
        .rtl-start { direction: rtl; text-align: start; }
        .ltr-end { text-align: end; }
    </style>
    <body>
        <div id="container">
            <p class="bold">Bold text</p>
            <p class="italic">Italic text</p>
            <p class="bold-italic">Bold italic text</p>
            <p class="underline">Underlined text</p>
            <p class="strike">Struck text</p>
            <p class="justify">Justified text</p>
            <p class="rtl-start">RTL start aligned</p>
            <p class="ltr-end">LTR end aligned</p>
        </div>
    </body>
</html>
