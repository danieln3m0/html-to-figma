<html>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
        body { font-family: 'Noto Sans', sans-serif; }
        button, input { font: inherit; }
        .Shadows {
            position: relative;
            display: block;
            width: 100px;
            height: 100px;
            margin: 50px;
            box-shadow: 0 0 0 1px rgb(0 0 0 / 5%), 0 1px 0 1px rgb(0 0 0 / 5%), 0 4px 6px 0 rgb(0 0 0 / 5%);
        }
        .InsetShadow {
            position: relative;
            display: block;
            width: 100px;
            height: 100px;
            margin: 50px;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 25%);
        }
        
    </style>
    <body>
        <div id="container">
            <div class="Shadows"></div>
            <div class="InsetShadow"></div>
        </div>
    </body>
</html>
